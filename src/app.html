<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="CHASE" />
		<link rel="manifest" href="/site.webmanifest" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
		<script>
			// Set data-theme before first paint to avoid a flash of the wrong theme.
			// Mirrors the logic in src/lib/utils/theme.svelte.ts.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						!stored || stored === 'system' || stored === 'undefined'
							? window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: stored;
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
			const observer = new MutationObserver((mutations) => {
				mutations.forEach(() => {
					document.querySelectorAll('.fa-duotone').forEach(icon => {
						icon.classList.replace('fa-duotone', 'fa-solid');
					});
				});
			});
			
			// Start watching the entire webpage structure
			document.addEventListener('DOMContentLoaded', () => {
			    console.log('The DOM is fully parsed and ready!');
			    // Your code here
				observer.observe(document.body, { childList: true, subtree: true });
			});

			
		</script>
		<style>
			body {
				margin: 0;
				padding: 0;
				min-height: 100vh;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-base-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
